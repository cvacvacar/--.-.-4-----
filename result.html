<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Заказ принят — CofeeBean</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">

      <a href="index.html" class="logo">☕ CofeeBean</a>

      <p class="instruction">Пожалуйста, покажите этот экран бариста при получении.</p>
      
      <!-- Кнопка возврата -->
      <a href="index.html" class="btn btn-primary">Вернуться в меню</a>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CofeeBean. Учебный проект.</p>
